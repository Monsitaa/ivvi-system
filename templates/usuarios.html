{% extends "base.html" %}
{% block title %}Administración de Usuarios{% endblock %}
{% block content %}
<div class="card" style="max-width: 700px; margin-bottom: 2rem;">
    <h3><i class="fas fa-user-shield"></i> Añadir Nuevo Usuario</h3>
    <form action="{{ url_for('usuarios') }}" method="POST">
        <div class="form-group">
            <label>Nombre Completo</label>
            <input type="text" name="nombre" required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Rol</label>
                <select name="rol" required>
                    <option value="Administrador">Administrador</option>
                    <option value="Operador de Almacén">Operador de Almacén</option>
                    <option value="Vendedor">Vendedor</option>
                    <option value="Gerencia">Gerencia</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" required placeholder="********">
        </div>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Crear Usuario</button>
    </form>
</div>

<div class="card">
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td style="font-weight: 600;">{{ item.nombre }}</td>
                    <td>{{ item.email }}</td>
                    <td><span class="user-badge" style="background-color: var(--verde-oscuro); color: white;">{{ item.rol }}</span></td>
                    <td><span class="user-badge" style="background-color: var(--verde-claro);">{{ item.estado }}</span></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
