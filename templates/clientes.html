{% extends "base.html" %}
{% block title %}Gestión de Clientes{% endblock %}
{% block content %}
<div class="card" style="max-width: 800px; margin-bottom: 2rem;">
    <h3><i class="fas fa-user-plus"></i> Registro de Cliente</h3>
    <form action="{{ url_for('clientes') }}" method="POST">
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem;">
            <div class="form-group">
                <label>Nombre o Razón Social</label>
                <input type="text" name="nombre" required>
            </div>
            <div class="form-group">
                <label>RUC / ID</label>
                <input type="text" name="ruc" required>
            </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" name="telefono" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
        </div>
        <div class="form-group">
            <label>Dirección</label>
            <input type="text" name="direccion" required>
        </div>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Registrar Cliente</button>
    </form>
</div>

<div class="card">
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>RUC</th>
                    <th>Contacto</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td style="font-weight: 600;">{{ item.nombre }}</td>
                    <td>{{ item.ruc }}</td>
                    <td>{{ item.telefono }} <br> <small>{{ item.email }}</small></td>
                    <td><span class="user-badge" style="background-color: var(--verde-claro);">{{ item.estado }}</span></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
